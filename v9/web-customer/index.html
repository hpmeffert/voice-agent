<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voice Agent Customer</title>
  <style>
    body { font-family: ui-sans-serif, system-ui; margin:0; background:#f5f7fb; color:#111827; }
    .wrap { max-width: 920px; margin: 20px auto; padding: 0 14px; }
    .card { background:#fff; border:1px solid #d9e1ee; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.06); }
    .hd { padding:12px 14px; border-bottom:1px solid #d9e1ee; display:flex; justify-content:space-between; align-items:center; }
    .bd { padding:14px; }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    input, textarea, select, button { border:1px solid #cfd8e6; border-radius:8px; padding:8px 10px; }
    textarea { width:100%; min-height:84px; }
    button.primary { background:#0f766e; color:#fff; border-color:#0f766e; }
    button.warn { background:#991b1b; color:#fff; border-color:#991b1b; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .status { color:#6b7280; font-size:12px; }
    .chat { margin-top:12px; display:grid; gap:10px; }
    .msg { padding:10px; border-radius:10px; border:1px solid #dbe3f0; background:#fff; white-space:pre-wrap; }
    .me { background:#eefbf8; }
    .bot { background:#f8f4ff; }
    .iconBtn {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 16px;
      line-height: 1;
      padding: 0;
    }
    .helpModal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:120; }
    .helpModal.show { display:flex; }
    .helpCard { width:min(920px,96vw); max-height:86vh; overflow:auto; background:#fff; border:1px solid #d9e1ee; border-radius:12px; }
    .helpHd { padding:10px 12px; border-bottom:1px solid #d9e1ee; display:flex; justify-content:space-between; align-items:center; }
    .helpBd { padding:12px; line-height:1.45; }
    .helpBd h1, .helpBd h2, .helpBd h3 { margin:12px 0 8px; line-height:1.25; }
    .helpBd p { margin:8px 0; }
    .helpBd ul, .helpBd ol { margin:8px 0 8px 18px; padding:0; }
    .helpBd li { margin:4px 0; }
    .helpBd pre { margin:8px 0; padding:10px; border:1px solid #dbe3f0; border-radius:8px; background:#f8fafc; overflow:auto; }
    .helpBd code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size:12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="hd">
        <div>
          <b id="headerTitle">Voice Agent Customer</b>
          <div class="status" id="headerVersion">Version: v9.1.11</div>
          <div class="status" id="status">idle</div>
        </div>
        <div class="row">
          <label><span id="uiLangLabel">UI</span> <select id="uiLang"><option value="en">en</option><option value="de">de</option></select></label>
          <button id="helpBtn" class="iconBtn" title="Benutzerhilfe">?</button>
          <div class="status" id="ids">-</div>
        </div>
      </div>
      <div class="bd">
        <div class="row">
          <label><span id="labelUser">User</span> <input id="userId" size="30" /></label>
          <label><span id="labelSession">Session</span> <input id="sessionId" size="30" /></label>
          <button id="btnNewSession">Neue Session</button>
        </div>

        <div class="row" style="margin-top:10px;">
          <button id="btnRecord" class="primary">Record</button>
          <button id="btnStop" disabled>Stop</button>
          <button id="btnSendAudio" disabled>Send Audio</button>
          <label><input id="autoSendAfterRecord" type="checkbox" checked /> <span id="labelAutoSendAfterRecord">Auto-send after recording</span></label>
          <button id="btnRequestHandoff">Menschlichen Agenten anfordern</button>
          <button id="btnEndConversation" class="warn">End Conversation</button>
          <label><input id="listenMode" type="checkbox" /> <span id="labelListenMode">Listen Mode</span></label>
          <span class="status"><span id="labelSilence">Silence</span>: <b>1300ms</b></span>
          <span class="status" id="handoffStatus">Handoff: none</span>
          <label><span id="labelCustomerLang">Kundensprache</span> <select id="customerLang"><option value="auto">auto</option><option>de</option><option>en</option><option>no</option><option>sv</option><option>fi</option></select></label>
          <label><span id="labelTts">TTS</span> <select id="ttsLang"><option value="auto">auto</option><option>de</option><option>en</option><option>no</option><option>sv</option><option>fi</option></select></label>
        </div>

        <div style="margin-top:10px;">
          <textarea id="textInput" placeholder="Text eingeben und senden..."></textarea>
          <div class="row" style="margin-top:8px;">
            <button id="btnSendText" class="primary">Send Text</button>
          </div>
        </div>

        <audio id="audio" controls style="width:100%; margin-top:12px;"></audio>

        <div id="chat" class="chat"></div>
      </div>
    </div>
  </div>

  <div id="helpModal" class="helpModal">
    <div class="helpCard">
      <div class="helpHd"><b id="helpTitleText">Kunden-Hilfe</b><span id="helpVersion" class="status">Version: v9.1.11</span><button id="helpCloseBtn">Schliessen</button></div>
      <div id="helpBody" class="helpBd">Lade Hilfe...</div>
    </div>
  </div>

<script>
const USER_KEY = "v8_customer_user_id";
const SESSION_KEY = "v8_customer_session_id";
const LISTEN_KEY = "v8_customer_listen_mode";
const CUSTOMER_LANG_KEY = "v9_customer_lang";
const CUSTOMER_UI_LANG_KEY = "v9_customer_ui_lang";
const AUTO_SEND_AFTER_RECORD_KEY = "v9_customer_auto_send_after_record";
const SILENCE_MS = 1300;
const MIN_VOICE_RMS = 0.012;
const MAX_RECORD_MS = 45000;
const NO_SPEECH_MS = 8000;

const userIdEl = document.getElementById("userId");
const sessionIdEl = document.getElementById("sessionId");
const idsEl = document.getElementById("ids");
const statusEl = document.getElementById("status");
const chatEl = document.getElementById("chat");
const audioEl = document.getElementById("audio");
const customerLangEl = document.getElementById("customerLang");
const ttsLangEl = document.getElementById("ttsLang");
const textInputEl = document.getElementById("textInput");
const btnRecord = document.getElementById("btnRecord");
const btnStop = document.getElementById("btnStop");
const btnSendAudio = document.getElementById("btnSendAudio");
const btnSendText = document.getElementById("btnSendText");
const btnNewSession = document.getElementById("btnNewSession");
const btnEndConversation = document.getElementById("btnEndConversation");
const btnRequestHandoff = document.getElementById("btnRequestHandoff");
const listenModeEl = document.getElementById("listenMode");
const handoffStatusEl = document.getElementById("handoffStatus");
const autoSendAfterRecordEl = document.getElementById("autoSendAfterRecord");
const headerTitleEl = document.getElementById("headerTitle");
const headerVersionEl = document.getElementById("headerVersion");
const uiLangEl = document.getElementById("uiLang");
const uiLangLabelEl = document.getElementById("uiLangLabel");
const labelUserEl = document.getElementById("labelUser");
const labelSessionEl = document.getElementById("labelSession");
const labelAutoSendAfterRecordEl = document.getElementById("labelAutoSendAfterRecord");
const labelListenModeEl = document.getElementById("labelListenMode");
const labelSilenceEl = document.getElementById("labelSilence");
const labelCustomerLangEl = document.getElementById("labelCustomerLang");
const labelTtsEl = document.getElementById("labelTts");
const helpBtn = document.getElementById("helpBtn");
const helpTitleText = document.getElementById("helpTitleText");
const helpModal = document.getElementById("helpModal");
const helpVersion = document.getElementById("helpVersion");
const helpCloseBtn = document.getElementById("helpCloseBtn");
const helpBody = document.getElementById("helpBody");

let mediaRecorder = null;
let chunks = [];
let lastBlob = null;
let ws = null;
let loopActive = false;
let audioCtx = null;
let analyser = null;
let dataArray = null;
let rmsInterval = null;
let recordStartedAt = 0;
let speechStartedAt = 0;
let lastVoiceAt = 0;
let handoffRequested = false;
let handoffState = "none";
let uiStrings = {};
let uiLangCurrent = "en";

const BUILTIN_UI_STRINGS = {
  en: {
    "customer.title": "Voice Agent Customer",
    "customer.help": "Customer Help",
    "customer.user": "User",
    "customer.session": "Session",
    "customer.new_session": "New Session",
    "customer.record": "Record",
    "customer.stop": "Stop",
    "customer.send_audio": "Send Audio",
    "customer.auto_send": "Auto-send after recording",
    "customer.request_handoff": "Request human agent",
    "customer.end_conversation": "End Conversation",
    "customer.listen_mode": "Listen Mode",
    "customer.silence": "Silence",
    "customer.handoff": "Handoff",
    "customer.language": "Customer language",
    "customer.tts": "TTS",
    "customer.send_text": "Send Text",
    "customer.text_placeholder": "Type text and send...",
    "customer.help_loading": "Loading help...",
    "customer.help_close": "Close",
    "status.idle": "idle",
    "status.listening": "listening",
    "status.recording": "recording",
    "status.uploading": "uploading",
    "status.speaking": "speaking",
    "chat.customer": "Customer",
    "chat.agent": "Agent",
    "chat.system": "System"
  },
  de: {
    "customer.title": "Voice Agent Kunde",
    "customer.help": "Kunden-Hilfe",
    "customer.user": "User",
    "customer.session": "Session",
    "customer.new_session": "Neue Session",
    "customer.record": "Aufnehmen",
    "customer.stop": "Stopp",
    "customer.send_audio": "Audio senden",
    "customer.auto_send": "Auto-Senden nach Aufnahme",
    "customer.request_handoff": "Menschlichen Agenten anfordern",
    "customer.end_conversation": "Konversation beenden",
    "customer.listen_mode": "Listen Mode",
    "customer.silence": "Stille",
    "customer.handoff": "Handoff",
    "customer.language": "Kundensprache",
    "customer.tts": "TTS",
    "customer.send_text": "Text senden",
    "customer.text_placeholder": "Text eingeben und senden...",
    "customer.help_loading": "Lade Hilfe...",
    "customer.help_close": "Schliessen",
    "status.idle": "bereit",
    "status.listening": "hoert zu",
    "status.recording": "nimmt auf",
    "status.uploading": "laedt hoch",
    "status.speaking": "spricht",
    "chat.customer": "Kunde",
    "chat.agent": "Agent",
    "chat.system": "System"
  }
};

function t(key, fallback){
  return uiStrings[key] || fallback || key;
}

function setStatus(s){
  const key = `status.${String(s || "").toLowerCase()}`;
  statusEl.textContent = t(key, String(s || ""));
}
function setVersion(v){
  const ver = v || "v9.1.11";
  document.title = `${t("customer.title", "Voice Agent Customer")} ${ver}`;
  headerTitleEl.textContent = `${t("customer.title", "Voice Agent Customer")} ${ver}`;
  headerVersionEl.textContent = `Version: ${ver}`;
  helpVersion.textContent = `Version: ${ver}`;
}
function makeId(){ return crypto.randomUUID ? crypto.randomUUID() : String(Date.now()); }
function refreshIds(){ idsEl.textContent = `User: ${userIdEl.value} | Session: ${sessionIdEl.value || "-"}`; }
function persistIds(){ localStorage.setItem(USER_KEY, userIdEl.value); localStorage.setItem(SESSION_KEY, sessionIdEl.value); refreshIds(); }
function addMsg(cls, title, text){ const d = document.createElement('div'); d.className = `msg ${cls}`; d.textContent = `${title}:\n${text}`; chatEl.appendChild(d); chatEl.scrollTop = chatEl.scrollHeight; }
function selectedCustomerLang(){
  const v = (customerLangEl.value || '').toLowerCase();
  if (v && v !== 'auto') return v;
  return '';
}
function wsUrl(path){ const proto = location.protocol === 'https:' ? 'wss' : 'ws'; return `${proto}://${location.host}${path}`; }
function setHandoff(state, requested){
  handoffState = state || "none";
  handoffRequested = !!requested;
  const txt = handoffRequested ? `requested (${handoffState})` : handoffState;
  handoffStatusEl.textContent = `${t("customer.handoff", "Handoff")}: ${txt}`;
  btnRequestHandoff.disabled = handoffRequested;
}

function resolveUiLang(lang) {
  return String(lang || "").trim().toLowerCase() === "de" ? "de" : "en";
}

function applyUiStrings() {
  uiLangLabelEl.textContent = "UI";
  labelUserEl.textContent = t("customer.user", "User");
  labelSessionEl.textContent = t("customer.session", "Session");
  btnNewSession.textContent = t("customer.new_session", "New Session");
  btnRecord.textContent = t("customer.record", "Record");
  btnStop.textContent = t("customer.stop", "Stop");
  btnSendAudio.textContent = t("customer.send_audio", "Send Audio");
  labelAutoSendAfterRecordEl.textContent = t("customer.auto_send", "Auto-send after recording");
  btnRequestHandoff.textContent = t("customer.request_handoff", "Request human agent");
  btnEndConversation.textContent = t("customer.end_conversation", "End Conversation");
  labelListenModeEl.textContent = t("customer.listen_mode", "Listen Mode");
  labelSilenceEl.textContent = t("customer.silence", "Silence");
  labelCustomerLangEl.textContent = t("customer.language", "Customer language");
  labelTtsEl.textContent = t("customer.tts", "TTS");
  btnSendText.textContent = t("customer.send_text", "Send Text");
  textInputEl.placeholder = t("customer.text_placeholder", "Type text and send...");
  helpBtn.title = t("customer.help", "Customer Help");
  helpTitleText.textContent = t("customer.help", "Customer Help");
  helpCloseBtn.textContent = t("customer.help_close", "Close");
}

async function loadUiI18n(lang) {
  const resolved = resolveUiLang(lang);
  uiStrings = { ...(BUILTIN_UI_STRINGS[resolved] || BUILTIN_UI_STRINGS.en) };
  try {
    const r = await fetch(`/api/i18n?scope=customer&lang=${encodeURIComponent(resolved)}`, { cache: "no-store" });
    if (r.ok) {
      const data = await r.json();
      const remote = (data && data.strings && typeof data.strings === "object") ? data.strings : {};
      uiStrings = { ...uiStrings, ...remote };
    }
  } catch (_) {}
  applyUiStrings();
  setVersion(headerVersionEl.textContent.replace(/^Version:\s*/, "") || "v9.1.11");
  setStatus(loopActive ? "listening" : "idle");
  setHandoff(handoffState, handoffRequested);
}

async function loadUiLangPreferenceFromDb() {
  const uid = (userIdEl.value || "").trim();
  if (!uid || uid.length < 3) return null;
  try {
    const r = await fetch(`/api/prefs/ui_lang?user_id=${encodeURIComponent(uid)}&scope=customer`, { cache: "no-store" });
    if (!r.ok) return null;
    const data = await r.json();
    const lang = String((data || {}).ui_lang || "").trim().toLowerCase();
    return lang ? resolveUiLang(lang) : null;
  } catch (_) {
    return null;
  }
}

async function persistUiLangPreference(lang) {
  const uid = (userIdEl.value || "").trim();
  if (!uid || uid.length < 3) return;
  try {
    await fetch("/api/prefs/ui_lang", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id: uid, scope: "customer", ui_lang: resolveUiLang(lang) }),
    });
  } catch (_) {}
}

function escapeHtml(s) {
  return String(s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function renderMarkdown(md) {
  let html = escapeHtml(md || '');
  html = html.replace(/```([\s\S]*?)```/g, (_m, code) => `<pre><code>${code}</code></pre>`);
  html = html.replace(/^### (.*)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.*)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.*)$/gm, '<h1>$1</h1>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/^\- (.*)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>[\s\S]*?<\/li>)/g, '<ul>$1</ul>');
  html = html.replace(/<\/ul>\s*<ul>/g, '');
  html = html.replace(/\n{2,}/g, '</p><p>');
  html = `<p>${html}</p>`;
  html = html.replace(/<p>\s*(<h[1-3]>)/g, '$1');
  html = html.replace(/(<\/h[1-3]>)\s*<\/p>/g, '$1');
  html = html.replace(/<p>\s*(<ul>)/g, '$1');
  html = html.replace(/(<\/ul>)\s*<\/p>/g, '$1');
  html = html.replace(/<p>\s*(<pre>)/g, '$1');
  html = html.replace(/(<\/pre>)\s*<\/p>/g, '$1');
  return html;
}

function helpLang() {
  return uiLangCurrent === 'de' ? 'de' : 'en';
}

async function openHelp() {
  helpModal.classList.add('show');
  helpBody.textContent = t("customer.help_loading", "Loading help...");
  const lang = helpLang();
  try {
    const r = await fetch(`/api/docs?type=customer&lang=${encodeURIComponent(lang)}`, { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const txt = await r.text();
    helpBody.innerHTML = renderMarkdown(txt);
  } catch (err) {
    helpBody.textContent = `Kunden-Hilfe konnte nicht geladen werden: ${String(err)}`;
  }
}

function closeHelp() { helpModal.classList.remove('show'); }

function stateIdle(){ setStatus(loopActive ? 'listening' : 'idle'); }

function closeWs(){ if (ws) { try { ws.close(); } catch(_) {} ws = null; } }
async function playAgentTts(text, lang){
  try {
    const r = await fetch('/tts/tts', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ text, lang: lang || 'de' }),
    });
    if (!r.ok) return;
    const b = await r.blob();
    audioEl.src = URL.createObjectURL(b);
    await audioEl.play();
  } catch(_) {}
}
function connectSessionWs(){
  closeWs();
  const sid = (sessionIdEl.value || '').trim();
  if (!sid) return;
  const uid = (userIdEl.value || '').trim();
  const selectedLang = selectedCustomerLang();
  const laneQuery = selectedLang ? `&customer_lang=${encodeURIComponent(selectedLang)}` : '';
  ws = new WebSocket(wsUrl(`/api/ws/session/${encodeURIComponent(sid)}?client=customer&user_id=${encodeURIComponent(uid)}${laneQuery}`));
  ws.onopen = () => stateIdle();
  ws.onclose = () => stateIdle();
  ws.onerror = () => setStatus('ws-error');
  ws.onmessage = async (ev) => {
    try {
      const e = JSON.parse(ev.data);
      if (e.type === 'session.keepalive') return;
      if (e.type === 'session.connected') {
        const h = (e.payload && e.payload.handoff) || {};
        setHandoff(h.state || "none", !!h.requested);
        return;
      }
      if (e.from === 'agent' && e.payload && (e.payload.text || (e.payload.customer && e.payload.customer.text))) {
        const p = e.payload || {};
        const laneCustomer = p.customer || {};
        const laneTts = p.tts || {};
        const customerText = String(laneCustomer.text || p.text || '');
        if (customerText) addMsg('bot', t("chat.agent", "Agent"), customerText);
        const ttsText = String(laneTts.customer_text || '');
        const ttsLang = String(laneTts.customer_lang || p.tts_lang || laneCustomer.lang || ttsLangEl.value || 'de');
        if (ttsText) await playAgentTts(ttsText, ttsLang);
      }
      if (e.from === 'customer' && e.payload) {
        const p = e.payload || {};
        const ownText = String((p.customer && p.customer.text) || p.text_original || p.text || '');
        if (ownText) addMsg('me', t("chat.customer", "Kunde"), ownText);
      }
      if (e.from === 'system' && e.type === 'session.joined') {
        addMsg('bot', t("chat.system", "System"), `Agent ${e.payload?.agent_id || ''} joined`);
      }
      if (e.type === 'handoff.request') {
        setHandoff('requested', true);
        addMsg('bot', t("chat.system", "System"), 'Handoff requested. Bitte kurz warten, ein Agent uebernimmt.');
      }
      if (e.type === 'handoff.accept') {
        setHandoff('accepted', false);
        addMsg('bot', t("chat.system", "System"), `Agent ${e.payload?.agent_id || ''} hat den Handoff angenommen.`);
      }
    } catch(_) {}
  };
}

function cleanupVad(){
  if (rmsInterval) { clearInterval(rmsInterval); rmsInterval = null; }
  analyser = null;
  dataArray = null;
  if (audioCtx) { try { audioCtx.close(); } catch(_) {} audioCtx = null; }
}

function stopRecordingInternal(){
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
}

async function startRecording({ autoSend = false } = {}){
  if (mediaRecorder && mediaRecorder.state !== 'inactive') return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks = [];
    lastBlob = null;
    speechStartedAt = 0;
    lastVoiceAt = 0;
    recordStartedAt = Date.now();

    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      try {
        lastBlob = new Blob(chunks, { type: mediaRecorder.mimeType || 'audio/webm' });
      } catch (_) {
        lastBlob = null;
      }
      btnSendAudio.disabled = !lastBlob;
      stream.getTracks().forEach(t => t.stop());
      cleanupVad();
      btnRecord.disabled = false;
      btnStop.disabled = true;

      if (autoSend && lastBlob) {
        await sendAudio({ fromLoop: true });
      } else {
        stateIdle();
      }
    };
    mediaRecorder.start();

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    dataArray = new Float32Array(analyser.fftSize);
    source.connect(analyser);

    rmsInterval = setInterval(() => {
      if (!analyser || !mediaRecorder || mediaRecorder.state === 'inactive') return;
      analyser.getFloatTimeDomainData(dataArray);
      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) sum += dataArray[i] * dataArray[i];
      const rms = Math.sqrt(sum / dataArray.length);
      const now = Date.now();

      if (rms > MIN_VOICE_RMS) {
        if (!speechStartedAt) speechStartedAt = now;
        lastVoiceAt = now;
      }

      if ((now - recordStartedAt) > MAX_RECORD_MS) {
        stopRecordingInternal();
        return;
      }
      if (!speechStartedAt && (now - recordStartedAt) > NO_SPEECH_MS) {
        stopRecordingInternal();
        return;
      }
      if (speechStartedAt && lastVoiceAt && (now - lastVoiceAt) >= SILENCE_MS) {
        stopRecordingInternal();
      }
    }, 120);

    setStatus('recording');
    btnRecord.disabled = true;
    btnStop.disabled = false;
  } catch (e) {
    setStatus(`error: ${e}`);
    loopActive = false;
  }
}

async function sendAudio({ fromLoop = false } = {}){
  if (!lastBlob) return;
  setStatus('uploading');
  const fd = new FormData();
  fd.append('file', lastBlob, 'speech.webm');
  fd.append('user_id', userIdEl.value);
  fd.append('session_id', sessionIdEl.value || '');
  fd.append('return_audio', '1');
  if (ttsLangEl.value !== 'auto') fd.append('tts_lang', ttsLangEl.value);
  if (selectedCustomerLang()) fd.append('customer_lang', selectedCustomerLang());

  try {
    const r = await fetch('/api/voice', { method:'POST', body: fd });
    if (!r.ok) {
      setStatus(`error ${r.status}`);
      loopActive = false;
      return;
    }

    const blob = await r.blob();
    const transcript = r.headers.get('X-Transcript') || '';
    const answer = r.headers.get('X-Answer') || '';
    const sid = r.headers.get('X-Session-Id') || sessionIdEl.value;
    const handoffRequestedHeader = r.headers.get('X-Handoff-Requested');
    const handoffStateHeader = r.headers.get('X-Handoff-State');
    sessionIdEl.value = sid; persistIds(); connectSessionWs();
    if (handoffRequestedHeader !== null || handoffStateHeader) {
      setHandoff(handoffStateHeader || "none", handoffRequestedHeader === "1");
    }

    if (transcript) addMsg('me', t("chat.customer", "Kunde"), decodeURIComponent(transcript));

    audioEl.src = URL.createObjectURL(blob);
    setStatus('speaking');
    try { await audioEl.play(); } catch(_) { stateIdle(); }
  } catch (e) {
    setStatus(`error: ${e}`);
    loopActive = false;
  } finally {
    if (!fromLoop) btnSendAudio.disabled = false;
  }
}

audioEl.addEventListener('ended', async () => {
  if (loopActive) {
    await startRecording({ autoSend: true });
    return;
  }
  stateIdle();
});

userIdEl.value = localStorage.getItem(USER_KEY) || makeId();
sessionIdEl.value = localStorage.getItem(SESSION_KEY) || '';
listenModeEl.checked = localStorage.getItem(LISTEN_KEY) === '1';
customerLangEl.value = localStorage.getItem(CUSTOMER_LANG_KEY) || 'auto';
autoSendAfterRecordEl.checked = localStorage.getItem(AUTO_SEND_AFTER_RECORD_KEY) !== '0';
uiLangCurrent = resolveUiLang(localStorage.getItem(CUSTOMER_UI_LANG_KEY) || 'en');
uiLangEl.value = uiLangCurrent;
loopActive = listenModeEl.checked;
refreshIds();
connectSessionWs();

(async () => {
  let cfgDefaultLang = "en";
  try {
    const cfg = await fetch('/api/config', { cache: 'no-store' }).then(r => r.json());
    cfgDefaultLang = resolveUiLang((cfg && cfg.ui_lang_default) || "en");
    setVersion((cfg?.ui?.version) || "v9.1.11");
  } catch (_) {
    setVersion("v9.1.11");
  }
  const dbLang = await loadUiLangPreferenceFromDb();
  const preferred = resolveUiLang(dbLang || localStorage.getItem(CUSTOMER_UI_LANG_KEY) || cfgDefaultLang || "en");
  uiLangCurrent = preferred;
  uiLangEl.value = preferred;
  localStorage.setItem(CUSTOMER_UI_LANG_KEY, preferred);
  await loadUiI18n(preferred);
})();
stateIdle();

userIdEl.addEventListener('change', async () => {
  persistIds();
  connectSessionWs();
  const dbLang = await loadUiLangPreferenceFromDb();
  if (dbLang) {
    uiLangCurrent = resolveUiLang(dbLang);
    uiLangEl.value = uiLangCurrent;
    localStorage.setItem(CUSTOMER_UI_LANG_KEY, uiLangCurrent);
    await loadUiI18n(uiLangCurrent);
  }
});
sessionIdEl.addEventListener('change', () => { persistIds(); connectSessionWs(); });
listenModeEl.addEventListener('change', () => {
  loopActive = !!listenModeEl.checked;
  localStorage.setItem(LISTEN_KEY, loopActive ? '1' : '0');
  stateIdle();
});
customerLangEl.addEventListener('change', () => {
  localStorage.setItem(CUSTOMER_LANG_KEY, customerLangEl.value || 'auto');
  connectSessionWs();
});
autoSendAfterRecordEl.addEventListener('change', () => {
  localStorage.setItem(AUTO_SEND_AFTER_RECORD_KEY, autoSendAfterRecordEl.checked ? '1' : '0');
});
ttsLangEl.addEventListener('change', () => {
  connectSessionWs();
});
uiLangEl.addEventListener('change', async () => {
  uiLangCurrent = resolveUiLang(uiLangEl.value);
  uiLangEl.value = uiLangCurrent;
  localStorage.setItem(CUSTOMER_UI_LANG_KEY, uiLangCurrent);
  await loadUiI18n(uiLangCurrent);
  await persistUiLangPreference(uiLangCurrent);
});

btnNewSession.onclick = () => {
  sessionIdEl.value = '';
  persistIds();
  connectSessionWs();
  setHandoff('none', false);
  addMsg('me', t("chat.system", "System"), 'Neue Session gestartet');
};

btnRecord.onclick = async () => {
  await startRecording({ autoSend: !!autoSendAfterRecordEl.checked });
};

btnStop.onclick = () => {
  loopActive = false;
  listenModeEl.checked = false;
  localStorage.setItem(LISTEN_KEY, '0');
  stopRecordingInternal();
  stateIdle();
};

btnSendAudio.onclick = async () => {
  await sendAudio({ fromLoop: false });
};

btnEndConversation.onclick = () => {
  loopActive = false;
  listenModeEl.checked = false;
  localStorage.setItem(LISTEN_KEY, '0');
  stopRecordingInternal();
  stateIdle();
};

btnRequestHandoff.onclick = async () => {
  const sid = (sessionIdEl.value || '').trim();
  const uid = (userIdEl.value || '').trim();
  if (!sid || !uid) {
    addMsg('bot', t("chat.system", "System"), 'Bitte zuerst eine aktive Session starten.');
    return;
  }
  try {
    const r = await fetch('/api/handoff/request', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ session_id: sid, user_id: uid, reason: 'customer_request' }),
    });
    const data = await r.json();
    if (!r.ok) {
      addMsg('bot','Fehler', JSON.stringify(data));
      return;
    }
    setHandoff(String(data.handoff_state || 'requested'), !!data.handoff_requested);
    addMsg('me', t("chat.system", "System"), 'Menschlicher Agent wurde angefordert.');
  } catch (e) {
    addMsg('bot','Fehler', String(e));
  }
};

btnSendText.onclick = async () => {
  const text = (textInputEl.value || '').trim();
  if (!text) return;
  addMsg('me', t("chat.customer", "Kunde"), text);
  setStatus('thinking');
  const r = await fetch('/api/chat/text', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      text,
      user_id: userIdEl.value,
      session_id: sessionIdEl.value || '',
      tts_lang: ttsLangEl.value === 'auto' ? '' : ttsLangEl.value,
      lang: selectedCustomerLang(),
    })
  });
  const data = await r.json();
  if (!r.ok) { addMsg('bot','Fehler', JSON.stringify(data)); setStatus('error'); return; }
  sessionIdEl.value = data.session_id || sessionIdEl.value;
  persistIds();
  connectSessionWs();
  setHandoff(String(data.handoff_state || "none"), !!data.handoff_requested);
  if (data.handoff_recommended) {
    addMsg('bot', t("chat.system", "System"), 'LLM-Triage empfiehlt Handoff an menschlichen Agenten.');
  }
  textInputEl.value = '';
  stateIdle();
};

helpBtn.onclick = () => { openHelp(); };
helpCloseBtn.onclick = () => { closeHelp(); };
helpModal.onclick = (ev) => {
  if (ev.target === helpModal) closeHelp();
};

if (loopActive) {
  startRecording({ autoSend: true });
}
</script>
</body>
</html>
