<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voice Agent Test UI</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 24px auto; padding: 0 16px; }
    button { padding: 10px 14px; margin-right: 8px; }
    .row { margin: 12px 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    pre { background: #f3f4f6; padding: 12px; border-radius: 10px; overflow: auto; }
    .status { padding: 8px 12px; background: #eef2ff; border-radius: 10px; }
    audio { width: 100%; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Voice Agent Test UI</h1>

  <div class="row">
    <button id="btnRecord">🎙️ Record</button>
    <button id="btnStop" disabled>⏹ Stop</button>
    <span class="status" id="status">Idle</span>
  </div>

  <div class="row">
    <button id="btnSend" disabled>➡️ Send</button>
    <button id="btnClear">🧹 Clear</button>
  </div>

  <h3>Captured audio</h3>
  <audio id="audioPreview" controls></audio>

  <h3>Result (transcript/answer/lang)</h3>
  <pre id="result"></pre>

  <h3>Spoken reply (Piper)</h3>
  <audio id="audioReply" controls></audio>

<script>
let mediaRecorder;
let chunks = [];
let recordedBlob = null;

const el = (id) => document.getElementById(id);
const statusEl = el("status");
const resultEl = el("result");
const previewAudio = el("audioPreview");
const replyAudio = el("audioReply");
const SESSION_KEY = "voice_agent_session_id";

let sessionId = localStorage.getItem(SESSION_KEY) || "";

function setSessionId(id) {
  sessionId = id || "";
  if (sessionId) localStorage.setItem(SESSION_KEY, sessionId);
}

function setStatus(msg) { statusEl.textContent = msg; }

el("btnClear").onclick = async () => {
  chunks = [];
  recordedBlob = null;
  previewAudio.src = "";
  replyAudio.src = "";
  resultEl.textContent = "";
  el("btnSend").disabled = true;

  // reset local session id
  if (sessionId) {
    // optional: if you implement /api/session/reset in API, uncomment:
    // try {
    //   await fetch(`/api/session/reset`, {
    //     method: "POST",
    //     headers: {"Content-Type":"application/json"},
    //     body: JSON.stringify({ session_id: sessionId })
    //   });
    // } catch {}
  }

  localStorage.removeItem(SESSION_KEY);
  sessionId = "";

  setStatus("Idle (session reset)");
};

el("btnRecord").onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks = [];
    recordedBlob = null;

    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
    mediaRecorder.onstop = () => {
      recordedBlob = new Blob(chunks, { type: mediaRecorder.mimeType || "audio/webm" });
      previewAudio.src = URL.createObjectURL(recordedBlob);
      el("btnSend").disabled = false;
      setStatus("Recorded. Ready to send.");
      stream.getTracks().forEach(t => t.stop());
    };

    mediaRecorder.start();
    el("btnRecord").disabled = true;
    el("btnStop").disabled = false;
    setStatus("Recording...");
  } catch (err) {
    console.error(err);
    setStatus("Mic permission / recording error. Check browser permissions.");
  }
};

el("btnStop").onclick = () => {
  if (mediaRecorder && mediaRecorder.state !== "inactive") {
    mediaRecorder.stop();
    el("btnRecord").disabled = false;
    el("btnStop").disabled = true;
  }
};

el("btnSend").onclick = async () => {
  if (!recordedBlob) return;
  setStatus("Uploading to API...");

  try {
    // 1) Send audio to API (JSON result)
    const fd = new FormData();
    const filename = recordedBlob.type.includes("ogg") ? "audio.ogg" : "audio.webm";
    fd.append("file", recordedBlob, filename);
    fd.append("return_audio", "0");
    // Conversation Memory: send existing session id (if any)
    fd.append("session_id", sessionId);

    const r = await fetch(`/api/voice`, { method: "POST", body: fd });
    if (!r.ok) throw new Error(`API /voice failed: ${r.status} ${await r.text()}`);
    const data = await r.json();
    
    if (data.session_id) {
      setSessionId(data.session_id);
    }
    resultEl.textContent = JSON.stringify(data, null, 2);

    // 2) TTS via nginx proxy -> /tts/tts maps to piper:5002/tts
    setStatus("Generating speech via Piper...");
    const tts = await fetch(`/tts/tts`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ text: data.answer, lang: data.lang })
    });
    if (!tts.ok) throw new Error(`Piper /tts failed: ${tts.status} ${await tts.text()}`);
    const wavBlob = await tts.blob();
    replyAudio.src = URL.createObjectURL(wavBlob);

    setStatus("Done ✅");
  } catch (err) {
    console.error(err);
    setStatus(String(err));
  }
};
</script>
</body>
</html>
