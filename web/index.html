<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voice Agent Test UI</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 24px auto; padding: 0 16px; }
    button { padding: 10px 14px; margin-right: 8px; }
    .row { margin: 12px 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    pre { background: #f3f4f6; padding: 12px; border-radius: 10px; overflow: auto; }
    .status { padding: 8px 12px; background: #eef2ff; border-radius: 10px; }
    audio { width: 100%; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Voice Agent Test UI</h1>

  <div class="row">
    <label><b>Backend:</b></label>
    <select id="backend">
      <option value="ollama" selected>Ollama (local)</option>
      <option value="openai">OpenAI (cloud)</option>
    </select>

    <label><b>Model:</b></label>
      <select id="model"> </select>
  </div>

  <div class="row">
    <button id="btnRecord">🎙️ Record</button>
    <button id="btnStop" disabled>⏹ Stop</button>
    <span class="status" id="status">Idle</span>
  </div>

  <div class="row">
    <button id="btnSend" disabled>➡️ Send</button>
    <button id="btnClear">🧹 Clear</button>
  </div>

  <h3>Captured audio</h3>
  <audio id="audioPreview" controls></audio>

  <h3>Result (transcript/answer/lang)</h3>
  <pre id="result"></pre>

  <h3>Spoken reply (Piper)</h3>
  <audio id="audioReply" controls></audio>

<script>
let mediaRecorder;
let chunks = [];
let recordedBlob = null;

const el = (id) => document.getElementById(id);
const statusEl = el("status");
const resultEl = el("result");
const previewAudio = el("audioPreview");
const replyAudio = el("audioReply");

const SESSION_KEY = "voice_agent_session_id";
let sessionId = localStorage.getItem(SESSION_KEY) || "";

const backendSel = el("backend");
const modelSel = el("model");

let modelCatalog = null;

function setModelOptions(options, preferred) {
  modelSel.innerHTML = "";
  for (const name of options) {
    const opt = document.createElement("option");
    opt.value = name;
    opt.textContent = name;
    modelSel.appendChild(opt);
  }
  if (preferred && options.includes(preferred)) modelSel.value = preferred;
}

async function loadModels() {
  setStatus("Loading models...");
  const r = await fetchWithRetry("/api/models", 15, 1000);
  if (!r.ok) throw new Error(`/api/models failed: ${r.status}`);
  modelCatalog = await r.json();

  // default: ollama models
  const ollamaModels = modelCatalog?.ollama?.models || [];
  const defaultOllama = modelCatalog?.ollama?.default_model || "";
  if (ollamaModels.length > 0) {
    setModelOptions(ollamaModels, defaultOllama);
  } else {
    setModelOptions([defaultOllama || "qwen2.5:7b"], defaultOllama);
  }


  // If OpenAI not available, disable option in UI
  if (!modelCatalog?.openai?.available) {
    const opt = Array.from(backendSel.options).find(o => o.value === "openai");
    if (opt) opt.disabled = true;
  }

  setStatus("Idle");
}

backendSel.onchange = () => {
  if (!modelCatalog) return;

  if (backendSel.value === "openai") {
    const defaultOpenAI = modelCatalog?.openai?.default_model || "gpt-5";
    // keep a small curated list; you can expand later
    setModelOptions([defaultOpenAI], defaultOpenAI);
  } else {
    const ollamaModels = modelCatalog?.ollama?.models || [];
    const defaultOllama = modelCatalog?.ollama?.default_model || "";
    setModelOptions(ollamaModels.length ? ollamaModels : [defaultOllama], defaultOllama);
  }
};

// call on page load
loadModels().catch(err => {
  console.error(err);
  setStatus("Model load failed (see console).");
});

function setSessionId(id) {
  sessionId = id || "";
  if (sessionId) localStorage.setItem(SESSION_KEY, sessionId);
}

function setStatus(msg) { statusEl.textContent = msg; }

el("btnClear").onclick = () => {
  chunks = [];
  recordedBlob = null;
  previewAudio.src = "";
  replyAudio.src = "";
  resultEl.textContent = "";
  el("btnSend").disabled = true;

  localStorage.removeItem(SESSION_KEY);
  sessionId = "";

  setStatus("Idle (session reset)");
};

el("btnRecord").onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks = [];
    recordedBlob = null;

    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
    mediaRecorder.onstop = () => {
      recordedBlob = new Blob(chunks, { type: mediaRecorder.mimeType || "audio/webm" });
      previewAudio.src = URL.createObjectURL(recordedBlob);
      el("btnSend").disabled = false;
      setStatus("Recorded. Ready to send.");
      stream.getTracks().forEach(t => t.stop());
    };

    mediaRecorder.start();
    el("btnRecord").disabled = true;
    el("btnStop").disabled = false;
    setStatus("Recording...");
  } catch (err) {
    console.error(err);
    setStatus("Mic permission / recording error. Check browser permissions.");
  }
};

el("btnStop").onclick = () => {
  if (mediaRecorder && mediaRecorder.state !== "inactive") {
    mediaRecorder.stop();
    el("btnRecord").disabled = false;
    el("btnStop").disabled = true;
  }
};

el("btnSend").onclick = async () => {
  if (!recordedBlob) return;
  setStatus("Uploading to API...");

  try {
    const fd = new FormData();
    const filename = recordedBlob.type.includes("ogg") ? "audio.ogg" : "audio.webm";
    fd.append("file", recordedBlob, filename);
    fd.append("return_audio", "0");

    // ✅ send session id for conversation memory
    fd.append("session_id", sessionId);
    // V3 Select Model
    fd.append("backend", backendSel.value);
    fd.append("model", modelSel.value);

    const r = await fetch(`/api/voice`, { method: "POST", body: fd });
    if (!r.ok) {
      const txt = await r.text();
      if (r.status === 429) {
        throw new Error("OpenAI quota/billing missing (HTTP 429). Enable billing in OpenAI or switch backend to Ollama.");
      }
    
}

    if (data.session_id) setSessionId(data.session_id);

    resultEl.textContent = JSON.stringify(data, null, 2);

    setStatus(`Generating speech via Piper... (session ${sessionId ? sessionId.slice(0,8) : "new"})`);
    const tts = await fetch(`/tts/tts`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ text: data.answer, lang: data.lang })
    });
    if (!tts.ok) throw new Error(`Piper /tts failed: ${tts.status} ${await tts.text()}`);
    const wavBlob = await tts.blob();
    replyAudio.src = URL.createObjectURL(wavBlob);

    setStatus(`Done ✅ (session ${sessionId ? sessionId.slice(0,8) : "?"})`);
  } catch (err) {
    console.error(err);
    setStatus(String(err));
  }
};
</script>
</body>
</html>
