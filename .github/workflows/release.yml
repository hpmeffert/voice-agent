name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          NOTES_FILE="v7/docs/RELEASE_NOTES_${TAG}.md"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [ -f "$NOTES_FILE" ]; then
            echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "notes_file=v7/docs/RELEASE.md" >> "$GITHUB_OUTPUT"
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release artifacts
        run: |
          mkdir -p dist
          tar -czf "dist/voice-agent-${{ steps.meta.outputs.tag }}-v7.tar.gz" v7
          sha256sum "dist/voice-agent-${{ steps.meta.outputs.tag }}-v7.tar.gz" > "dist/voice-agent-${{ steps.meta.outputs.tag }}-v7.sha256"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voice-agent-${{ steps.meta.outputs.tag }}-artifacts
          path: dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Voice Agent ${{ steps.meta.outputs.tag }}
          body_path: ${{ steps.meta.outputs.notes_file }}
          files: |
            dist/voice-agent-${{ steps.meta.outputs.tag }}-v7.tar.gz
            dist/voice-agent-${{ steps.meta.outputs.tag }}-v7.sha256
